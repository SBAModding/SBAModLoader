name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets are empty for runs that are not allowed to see them; the release build is skipped then.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect the APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist/debug dist/release
          cp app/build/outputs/apk/debug/*.apk "dist/debug/SBAModLoader-${VERSION}-debug.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk "dist/release/SBAModLoader-${VERSION}.apk"
          fi
          ls -lR dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: SBAModLoader-debug
          path: dist/debug/*.apk

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: SBAModLoader-release
          path: dist/release/*.apk
          if-no-files-found: error

      # On a tag, attach the release APK to that tag's release (creating a draft if there is none yet). A file that is
      # already attached, for example a release APK uploaded by hand, is left alone.
      - name: Attach the release APK to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Built by CI. Edit these notes, then publish."
          fi
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in dist/release/*.apk; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "$name is already attached; leaving it as it is"
            else
              gh release upload "$TAG" "$f"
            fi
          done
